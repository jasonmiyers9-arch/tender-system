services:
  db:
    image: postgres:15-alpine
    container_name: tenderguard_db
    environment:
      POSTGRES_USER: tenderadmin
      POSTGRES_PASSWORD: tenderpassword
      POSTGRES_DB: tenderguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderadmin -d tenderguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tenderguard_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
